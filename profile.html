<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Doberman Index record router for published Doberman and kennel profiles.">
<meta name="robots" content="noindex,follow">
<title>Doberman Index — Profile</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f1f1;color:#121212;font-family:Arial,sans-serif}
main{width:min(720px,calc(100% - 40px));padding:36px;background:white;border-top:6px solid #f3fe19}
h1{margin:0 0 12px;font-size:34px}p{line-height:1.6;color:#555}
</style>
</head>
<body>
<main id="status" hidden aria-live="polite"></main>
<script src="assets/js/display-name.js"></script>
<script src="assets/js/lifecycle.js"></script>
<script src="assets/js/seo-runtime.js"></script>
<script>
(async()=>{
  const id=(new URLSearchParams(location.search).get("id")||"").trim().toUpperCase();
  const status=document.getElementById("status");
  const escapeHTML=value=>{const node=document.createElement("div");node.textContent=String(value??"");return node.innerHTML};
  const showStatus=html=>{status.hidden=false;status.innerHTML=html};
  if(!/^DI-[MFKL]-\d{6}$/.test(id)){showStatus('<h1>Profile ID required.</h1><p>Return to the <a href="./index.html">Doberman Index search</a> and choose a published record.</p>');return;}
  try{
    const [registry,policy]=await Promise.all([
      fetch("./data/registry.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("Registry unavailable");return r.json()}),
      window.DILifecycle.loadPolicy(document.baseURI)
    ]);
    const item=(registry.records||[]).find(x=>x.record_id===id&&x.status==="published");
    if(!item)throw new Error("Record not found in registry.");
    await window.DISEO.applyRecord(id,document.baseURI);
    const target=window.DILifecycle.templateFor(item,policy);
    const route={male:"./profiles/male.html",female:"./profiles/female.html",puppy:"./profiles/puppy.html",kennel:"./profiles/kennel-concept.html",litter:"./profiles/litter.html"}[target];
    if(route){location.replace(`${route}?id=${encodeURIComponent(id)}`);return;}
    const displayName=item.entity_type==="doberman"?window.DIName.displayRegisteredName(item.registered_name||id):(item.name||id);
    showStatus(`<h1>${escapeHTML(displayName)}</h1><p>The <strong>${escapeHTML(target||item.template||"record")}</strong> digital-card template is reserved in the architecture and will be connected here as soon as its design is approved.</p>`);
  }catch(error){showStatus(`<h1>Profile unavailable.</h1><p>${escapeHTML(error.message)}</p>`);}
})();
</script>
</body>
</html>
