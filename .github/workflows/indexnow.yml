name: IndexNow after Pages deploy

on:
  workflow_run:
    workflows:
      - pages-build-deployment
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  submit-indexnow:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out deployed commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test IndexNow publisher offline
        run: python scripts/test_indexnow.py

      - name: Submit changed canonical URLs after deploy
        if: ${{ github.event_name == 'workflow_run' }}
        run: python scripts/indexnow.py --mode changed --base HEAD^ --head HEAD

      - name: Submit all current sitemap URLs manually
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/indexnow.py --mode all
