name: Apply v4.2 Breed Intelligence Preview

on:
  push:
    branches: [v4.2-breed-intelligence]
    paths:
      - ".v42-patch/**"
      - ".github/workflows/apply-v42-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v42-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct v4.2 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .v42-patch/payload-*.b64 | base64 -d | gunzip > /tmp/v42.patch
          test -s /tmp/v42.patch

      - name: Prepare browser-review patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('/tmp/v42.patch').read_text(encoding='utf-8')
          chunks = src.split('diff --git ')
          keep = []
          for chunk in chunks:
              if not chunk:
                  continue
              header = chunk.splitlines()[0]
              if header.startswith('a/.github/workflows/build-registry.yml '):
                  continue
              keep.append('diff --git ' + chunk)
          Path('/tmp/v42-review.patch').write_text(''.join(keep), encoding='utf-8')
          PY
          test -s /tmp/v42-review.patch

      - name: Apply v4.2 browser review snapshot
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          rm -f \
            data/pedigree-graph.json \
            schemas/pedigree-graph.schema.json \
            scripts/apply_pedigree_intelligence.py \
            scripts/pedigree_engine.py \
            scripts/test_pedigree_engine.py \
            scripts/validate_pedigree_graph.py

          set +e
          patch -p1 --forward --batch --fuzz=3 < /tmp/v42-review.patch
          patch_rc=$?
          set -e

          rejects="$(find . -name '*.rej' -print)"
          if [ -n "$rejects" ]; then
            echo "Rejected v4.2 hunks remain:"
            echo "$rejects"
            for f in $rejects; do
              echo "===== $f ====="
              cat "$f"
            done
            exit 1
          fi
          if [ "$patch_rc" -ne 0 ]; then
            echo "patch exited with $patch_rc but produced no reject files; continuing to validation."
          fi
          git status --short

      - name: Validate pedigree engine and submission JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_pedigree_graph.py
          python scripts/test_pedigree_engine.py
          python scripts/apply_pedigree_intelligence.py
          node --check assets/js/submit-v3.js

      - name: Commit review snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Preview branch is already up to date."
            exit 0
          fi
          git commit -m "preview: apply v4.2 breed intelligence"
          git push origin HEAD:v4.2-breed-intelligence
