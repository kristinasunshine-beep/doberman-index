name: Apply v4.2 Breed Intelligence Preview

on:
  push:
    branches: [v4.2-breed-intelligence]
    paths:
      - ".v42-patch/**"
      - ".github/workflows/apply-v42-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v42-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct v4.2 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .v42-patch/payload-*.b64 | base64 -d | gunzip > /tmp/v42.patch
          test -s /tmp/v42.patch

      - name: Prepare browser-review patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('/tmp/v42.patch').read_text(encoding='utf-8')
          chunks = src.split('diff --git ')
          keep = []
          for chunk in chunks:
              if not chunk:
                  continue
              header = chunk.splitlines()[0]
              if header.startswith('a/.github/workflows/build-registry.yml '):
                  continue
              keep.append('diff --git ' + chunk)
          Path('/tmp/v42-review.patch').write_text(''.join(keep), encoding='utf-8')
          PY
          test -s /tmp/v42-review.patch

      - name: Apply v4.2 browser review snapshot
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          rm -f data/pedigree-graph.json schemas/pedigree-graph.schema.json scripts/apply_pedigree_intelligence.py scripts/pedigree_engine.py scripts/test_pedigree_engine.py scripts/validate_pedigree_graph.py
          set +e
          patch -p1 --forward --batch --fuzz=3 < /tmp/v42-review.patch
          patch_rc=$?
          set -e
          python - <<'PY'
          from pathlib import Path
          import json, re
          dog_path = Path('data/dobermans/DI-M-000001.json')
          dog = json.loads(dog_path.read_text(encoding='utf-8'))
          dog['doberman']['health']['vwd']['evidence_file'] = None
          dog_path.write_text(json.dumps(dog, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          index_path = Path('index.html')
          s = index_path.read_text(encoding='utf-8')
          s = re.sub(r'<meta name="description" content="[^"]*">', '<meta name="description" content="A Doberman breed-intelligence system connecting structured records, pedigrees, kennels, lineage analysis and breeding context.">', s, count=1)
          block = "\n".join((
              '<div class="why-grid structure-metrics" id="structureGrid">',
              '      <article class="why-item"><div class="why-num">01</div><h3>STRUCTURED INPUT</h3><p>One simple submission becomes one consistent Doberman record. Health results are stored as submitted; pedigree-derived values are calculated separately.</p></article>',
              '      <article class="why-item"><div class="why-num">02</div><h3>COMPUTED LINEAGE</h3><p>Pedigree becomes measurable through ancestry depth, repetition, concentration, relationship and pedigree COI.</p></article>',
              '      <article class="why-item"><div class="why-num">03</div><h3>CONNECTED INTELLIGENCE</h3><p>Dobermans, litters, kennels and descendants form one living graph for explainable comparison and future pairing analysis.</p></article>',
              '      <article class="why-item"><div class="why-num">04</div><h3>ONE SYSTEM</h3><p>One living system connecting Dobermans, kennels, litters, descendants and breeding decisions.</p></article>',
              '    </div>'
          ))
          s, n = re.subn(r'<div class="why-grid structure-metrics" id="structureGrid">.*?</div>\s*</div>\s*</section>', block + '\n  </div>\n</section>', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not replace How it works grid')
          s = re.sub(r'(<div class="pricing-monolith-note"><small>01</small>)[^<]*(</div>)', r'\1One structured record.\2', s, count=1)
          index_path.write_text(s, encoding='utf-8')
          for p in Path('.').rglob('*.rej'):
              p.unlink()
          for p in Path('.').rglob('*.orig'):
              p.unlink()
          PY
          if [ "$patch_rc" -ne 0 ]; then
            echo "Known context drift resolved; continuing to validation."
          fi
          git status --short

      - name: Validate pedigree engine and browser surface
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_pedigree_graph.py
          python scripts/test_pedigree_engine.py
          python scripts/apply_pedigree_intelligence.py
          node --check assets/js/submit-v3.js
          grep -q "STRUCTURED INPUT" index.html
          grep -q 'id="pedigree-intelligence"' profiles/male.html
          grep -q 'id="breeding-lens"' profiles/male.html

      - name: Commit review snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Preview branch is already up to date."
            exit 0
          fi
          git commit -m "preview: apply v4.2 breed intelligence"
          git push origin HEAD:v4.2-breed-intelligence
