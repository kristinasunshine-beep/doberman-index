name: Apply v4.2 Breed Intelligence Preview

on:
  push:
    branches: [v4.2-breed-intelligence]
    paths:
      - ".v42-patch/**"
      - ".github/workflows/apply-v42-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v42-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct v4.2 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .v42-patch/payload-*.b64 | base64 -d | gunzip > /tmp/v42.patch
          test -s /tmp/v42.patch

      - name: Apply v4.2 review snapshot
        shell: bash
        run: |
          set -u
          git apply --3way --whitespace=nowarn /tmp/v42.patch
          apply_rc=$?
          set -e

          if [ "$apply_rc" -ne 0 ]; then
            echo "Some current-main files differ from the v4.1 patch base. Resolving only true three-way conflicts in favor of the v4.2 review snapshot."
            git status --short
            conflicted="$(git diff --name-only --diff-filter=U || true)"
            if [ -n "$conflicted" ]; then
              while IFS= read -r file; do
                echo "Resolving $file from v4.2 stage"
                if git show ":3:$file" > "$file" 2>/dev/null; then
                  git add "$file"
                else
                  git checkout --theirs -- "$file" || true
                  git add "$file" || true
                fi
              done <<< "$conflicted"
            fi
          fi

          unresolved="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$unresolved" ]; then
            echo "Unresolved files remain:"
            echo "$unresolved"
            exit 1
          fi

          # The production build workflow itself is not required for browser review;
          # if its old-base hunk did not apply, keep the current branch copy unchanged.
          git status --short

      - name: Validate pedigree engine and submission JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_pedigree_graph.py
          python scripts/test_pedigree_engine.py
          python scripts/apply_pedigree_intelligence.py
          node --check assets/js/submit-v3.js

      - name: Commit review snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Preview branch is already up to date."
            exit 0
          fi
          git commit -m "preview: apply v4.2 breed intelligence"
          git push origin HEAD:v4.2-breed-intelligence
