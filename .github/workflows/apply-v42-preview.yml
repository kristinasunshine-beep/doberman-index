name: Apply v4.2 Breed Intelligence Preview

on:
  push:
    branches: [v4.2-breed-intelligence]
    paths:
      - ".v42-patch/**"
      - ".github/workflows/apply-v42-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v42-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct v4.2 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .v42-patch/payload-*.b64 | base64 -d | gunzip > /tmp/v42.patch
          test -s /tmp/v42.patch

      - name: Apply v4.2 changes over current main-derived branch
        shell: bash
        run: |
          set -euo pipefail
          if git apply --3way --whitespace=nowarn /tmp/v42.patch; then
            echo "v4.2 patch applied cleanly."
          else
            echo "Three-way conflicts found; resolving review branch conflicts in favor of the v4.2 product snapshot."
            conflicted="$(git diff --name-only --diff-filter=U)"
            test -n "$conflicted"
            while IFS= read -r file; do
              git checkout --theirs -- "$file"
              git add "$file"
            done <<< "$conflicted"
          fi

      - name: Validate pedigree engine and submission JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_pedigree_graph.py
          python scripts/test_pedigree_engine.py
          python scripts/apply_pedigree_intelligence.py
          node --check assets/js/submit-v3.js

      - name: Commit review snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Preview branch is already up to date."
            exit 0
          fi
          git commit -m "preview: apply v4.2 breed intelligence"
          git push origin HEAD:v4.2-breed-intelligence
