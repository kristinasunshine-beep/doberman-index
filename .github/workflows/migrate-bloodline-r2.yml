name: Migrate Bloodline Images to R2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-bloodline-r2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bloodline-r2-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Require media admin secret
        env:
          MEDIA_ADMIN_KEY: ${{ secrets.MEDIA_ADMIN_KEY }}
        run: |
          if [ -z "$MEDIA_ADMIN_KEY" ]; then
            echo "::error::MEDIA_ADMIN_KEY GitHub secret is not configured. Add the same key used by the R2 media admin uploader, then re-run this workflow."
            exit 1
          fi

      - name: Migrate selected Bloodline images to R2
        env:
          MEDIA_ADMIN_KEY: ${{ secrets.MEDIA_ADMIN_KEY }}
          DI_MEDIA_ADMIN_BASE: https://doberman-index-media-admin.dobermanindex-records.workers.dev
        run: python scripts/migrate_bloodline_images_to_r2.py

      - name: Validate Bloodline manifest
        run: python scripts/validate_bloodline_network.py

      - name: Commit migrated manifest and report
        run: |
          git add data/bloodline-images.json data/bloodline-r2-migration-report.json
          if git diff --cached --quiet; then
            echo "No Bloodline migration changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: migrate Bloodline images to R2"
          git push
