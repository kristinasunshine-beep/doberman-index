name: Rebuild Doberman Index Registry

on:
  push:
    branches: [main]
    paths:
      - "data/dobermans/**"
      - "data/kennels/**"
      - "data/litters/**"
      - "data/homepage.json"
      - "data/assessment-standard.json"
      - "data/promotion-belt.json"
      - "data/seo-manifest.json"
      - "data/relationship-opportunities.json"
      - "schemas/registry.schema.json"
      - "schemas/promotion-belt.schema.json"
      - "index.html"
      - "about.html"
      - "profile.html"
      - "submit.html"
      - "profiles/male.html"
      - "profiles/female.html"
      - "profiles/puppy.html"
      - "profiles/litter.html"
      - "profiles/kennel-concept.html"
      - "assets/js/display-name.js"
      - "assets/js/media-presentation.js"
      - "assets/css/submit-v3.css"
      - "assets/js/submit-v3.js"
      - "assets/js/zip-tools.js"
      - "data/lifecycle-policy.json"
      - "assets/js/lifecycle.js"
      - "assets/js/seo-runtime.js"
      - "assets/js/owner-link-kit.js"
      - "assets/css/seo-record.css"
      - "assets/js/litter-profile.js"
      - "scripts/apply_lifecycle_policy.py"
      - "scripts/validate_v63_contract.py"
      - "scripts/build_registry.py"
      - "scripts/migrate_lifecycle_v1_1.py"
      - "scripts/validate_lifecycle_contract.py"
      - "scripts/validate_homepage.py"
      - "scripts/validate_assessment_standard.py"
      - "scripts/validate_male_profile_contract.py"
      - "scripts/validate_male_visual_master.py"
      - "scripts/validate_promotion_belt.py"
      - "scripts/validate_submission_visual_master.py"
      - "scripts/validate_targeted_production_patch.py"
      - "scripts/test_registry_consistency.py"
      - "scripts/validate_gallery_schema_contract.py"
      - "scripts/validate_workflow_contract.py"
      - "scripts/test_display_name.js"
      - "scripts/test_lifecycle.js"
      - "scripts/test_public_ui.js"
      - "scripts/test_media_presentation.js"
      - "scripts/test_litter_profile.js"
      - "scripts/validate_litter_contract.py"
      - "scripts/build_seo.py"
      - "scripts/build_relationship_opportunities.py"
      - "scripts/validate_relationship_opportunities.py"
      - "scripts/validate_seo.py"
      - "scripts/validate_owner_link_kit.py"
      - "scripts/validate_repo_hygiene.py"
      - "scripts/sanitize_public_evidence.py"
      - "scripts/indexnow.py"
      - "scripts/test_indexnow.py"
      - "scripts/audit_performance.py"
      - "scripts/test_seo_runtime.js"
      - ".gitignore"
      - "media/**"
      - "robots.txt"
      - "llms.txt"
      - "sitemap.xml"
      - "records/**"
      - "CNAME"
      - ".github/workflows/build-registry.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild-registry:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Synchronize public data and rebuild registry
        run: |
          python scripts/sanitize_public_evidence.py
          python scripts/migrate_lifecycle_v1_1.py
          python scripts/apply_lifecycle_policy.py --write
          python scripts/build_registry.py
          python scripts/build_relationship_opportunities.py
          python scripts/build_seo.py

      - name: Validate lifecycle contract
        run: |
          python scripts/validate_lifecycle_contract.py
          python scripts/validate_v63_contract.py

      - name: Lock approved v5.9.21 submission visual master
        run: python scripts/validate_submission_visual_master.py

      - name: Validate homepage showcase
        run: python scripts/validate_homepage.py

      - name: Validate paid kennel promotion belt
        run: python scripts/validate_promotion_belt.py

      - name: Validate controlled profile standard
        run: python scripts/validate_assessment_standard.py

      - name: Validate male profile contract
        run: |
          python scripts/validate_male_profile_contract.py
          python scripts/validate_male_visual_master.py

      - name: Validate registered-name and focal-point presentation
        run: |
          node scripts/test_display_name.js
          node scripts/test_lifecycle.js
          node scripts/test_public_ui.js
          node scripts/test_media_presentation.js
          python scripts/validate_targeted_production_patch.py
          python scripts/test_registry_consistency.py
          python scripts/validate_gallery_schema_contract.py

      - name: Validate public litter system
        run: |
          node scripts/test_litter_profile.js
          python scripts/validate_litter_contract.py

      - name: Validate comprehensive SEO, graph and performance
        run: |
          node scripts/test_seo_runtime.js
          python scripts/validate_seo.py
          python scripts/validate_owner_link_kit.py
          python scripts/validate_relationship_opportunities.py
          python scripts/audit_performance.py

      - name: Validate repository hygiene
        shell: bash
        run: |
          rm -rf scripts/__pycache__
          rm -f scripts/indexnow.py scripts/test_indexnow.py
          rm -f scripts/build_relationship_opportunities.py scripts/validate_relationship_opportunities.py
          rm -f data/relationship-opportunities.json
          find media -type d -name evidence -prune -exec rm -rf {} +
          python scripts/sanitize_public_evidence.py
          python scripts/validate_repo_hygiene.py

      - name: Validate GitHub Actions workflow contract
        run: python scripts/validate_workflow_contract.py

      - name: Commit generated public data if changed
        shell: bash
        run: |
          if git diff --quiet -- data/dobermans data/kennels data/litters data/registry.json data/seo-manifest.json records sitemap.xml; then
            echo "Public data, lifecycle, registry and SEO outputs are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dobermans data/litters data/registry.json data/kennels data/seo-manifest.json records sitemap.xml
          git commit -m "chore: sync public lifecycle, registry and SEO"
          git push
